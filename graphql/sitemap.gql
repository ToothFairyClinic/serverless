query GetServicesForSitemap {
  # 1. Запит для послуг (виключає гео-сторінки та nofollow)
  services(
    where: {
      _and: [
        { _or: [{ is_geo_page: { _eq: false } }, { is_geo_page: { _is_null: true } }] }
        { _or: [{ custom_robots: { _is_null: true } }, { custom_robots: { _nilike: "%nofollow%" } }] }
      ]
    }
  ) {
    id
    slug
    slug_en
    is_geo_page
    custom_robots
    updated_at
  }

  # 2. Новий запит для лікарів (додано для генерації /ua/doctors/slug та /en/doctors/slug)
  personnel {
    id
    slug
    slug_en
    updated_at
  }

  # 3. Метадані для статичних сторінок (/contacts, /price-list тощо)
  page_metadata {
    page_route
    updated_at
  }
}