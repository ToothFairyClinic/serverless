query GetServicesForSitemap {
  services(
    where: {
      _and: [
        { _or: [{ is_geo_page: { _eq: false } }, { is_geo_page: { _is_null: true } }] }
        { _or: [{ custom_robots: { _is_null: true } }, { custom_robots: { _nilike: "%nofollow%" } }] }
      ]
    }
  ) {
    id
    slug
    slug_en
    is_geo_page
    custom_robots
    updated_at
  }
  page_metadata {
    page_route
    updated_at
  }
}